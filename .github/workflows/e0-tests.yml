name: E0 offline tests

on:
  push:
    branches: [main, e0-direct-api-reproduce]
  pull_request:
    branches: [main]

jobs:
  e0:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pytest suite
        run: python -m pytest -q

      - name: Direct API dry-run (no credentials)
        run: python experiments/E0/run_direct_api.py --dry-run --limit 1
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""

      - name: E0 gold-reference validation
        run: python experiments/E0/reproduce_genuine_tables.py --validate-only --skip-pytest
