# Model registry for the SchemaBridge paper (E0-E5).
#
# NOTE: this package is OFFLINE-ONLY.  Nothing here is used to call an API or load weights;
# the file documents which model produced which archived artefact.  Generation settings were
# read from the original generation scripts (RSchema_ExpResults4/Code/*.py), not invented.
# No credentials belong in this file.

models:
  # ---- open-weight describers/constructors (local archives exist) ----------------------
  codellama13b:
    display_name: "CodeLlama-13B"
    provider: huggingface
    model_id: codellama/CodeLlama-13b-Instruct-hf
    open_weights: true
    archived_predictions: true
  llama31:
    display_name: "Llama-3.1-8B"
    provider: huggingface
    model_id: meta-llama/Meta-Llama-3.1-8B-Instruct
    open_weights: true
    archived_predictions: true
  deepseek:
    display_name: "DeepSeek-Coder-6.7B"
    provider: huggingface
    model_id: deepseek-ai/deepseek-coder-6.7b-instruct
    open_weights: true
    archived_predictions: true

  # ---- proprietary models: PAPER NUMBERS ONLY, no predictions on disk --------------------
  # (see figures/fig5_source_audit.md: 0/518 RSchema and 0/239 SchemaBench per-schema outputs)
  claude_sonnet_4_6:
    display_name: "Claude Sonnet 4.6"
    provider: anthropic
    model_id: null            # exact API id is not recorded anywhere on disk
    open_weights: false
    archived_predictions: false
  gpt_5_4_mini:
    display_name: "GPT-5.4-mini"
    provider: openai
    model_id: null            # exact API id is not recorded anywhere on disk
    open_weights: false
    archived_predictions: false

  # ---- fixed constructor of E2 (round trip) ----------------------------------------------
  gpt4omini_constructor:
    display_name: "GPT-4o-mini (E2 constructor)"
    provider: openai
    model_id: gpt-4o-mini
    open_weights: false
    archived_predictions: true     # results/predictions/e2/*_rt_*
    role: e2_constructor

# Generation settings used by the ORIGINAL runs (kept for provenance only).
generation:
  text2schema:            # E0 (Exp4) open models
    temperature: 0.1
    max_new_tokens: 2048
    source: RSchema_ExpResults4/Code/rschema_exp4_text2schema_allLLM.py
  schema2text:            # E1 (Exp4 / Experiment2) open describers
    temperature: 0.2
    max_new_tokens: 3072
    source: RSchema_ExpResults4/Code/rschema_exp4_schema2text_allLLM.py
  gpt4omini_constructor:  # E2 constructor
    temperature: 0.2
    source: RSchemaCode/rschema_text2schema_allLLM.py (GPT-4o-mini branch)

defaults:
  online: false
  seed: null              # the original runs did not record a seed
