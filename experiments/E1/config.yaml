experiment: E1
title: "Schema -> Text (Table VII, `tab:e1_s2t`)"
paper_table_label: "tab:e1_s2t"
online: false            # default path is offline evaluation of authoritative archives
tolerance:
  float_3dp: 0.0005
  float_2dp: 0.005       # BLEU-4 (0-100 scale, 2dp)
datasets:
  - "Enterprise-145 (145, SCR only)"
  - "RSchema (381 DDL-matched)"
  - "SchemaBench (239)"
models: "CodeLlama-13B, Llama-3.1-8B, DeepSeek-Coder (open); Claude Sonnet 4.6, GPT-5.4-mini (API archives)"
metrics: "BLEU-4 (0-100), ROUGE-L, BERTScore-F1, SCR for Basic (B) and Detailed (D)"
prompts:
  basic: "prompts/describer_basic.txt"       # schema2text1 short; SHA256(strip) e1422bc8…
  detailed: "prompts/describer_detailed.txt" # schema2text2 exhaustive; SHA256(strip) f09fc8ca…
authoritative_predictions:
  # Host archives — never SchemaBridge/results/predictions/e1/schemabench_*
  enterprise_basic: "/data/LLMTranslations/Exp1/Schema2Text1_{llm}/"
  enterprise_detailed: "/data/LLMTranslations/Exp2/Schema2Text2_{llm}/"
  rschema_basic: "/data/RSchema_ExpResults4/Exp1/schema2text_{llm}/"
  rschema_detailed: "/data/RSchema_ExpResults4/Experiment2/schema2text_{llm}/"
  schemabench_basic: "/data/SchemaBench/Exp1/schema2text_{llm}/"
  schemabench_detailed: "/data/SchemaBench/Experiment/schema2text_{llm}/"
excluded_stale:
  - "results/predictions/e1/schemabench_* (Experiment4 / empty NL)"
  - "results/predictions/e1/rschema_* (incomplete open-only Detailed)"
verified_outputs: "experiments/E1/outputs/verified/"
status: "VERIFIED — full tab:e1_s2t recomputed; manuscript uses corrected SchemaBench Detailed open cells"
